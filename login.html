<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home-style.css">
    <title>Imposter</title>
</head>
<body>
    <!-- The div class=outber border etc is for css to make double border-->
    <div class="outer-border">
        <div class="inner-border">
            <div class="login-box">
                <form action = "includes/login.inc.php" method = "POST">
                    <h1>Username</h1>
                    <input type="text" class="input-field" id="username" placeholder="- - - - - - - - - - - - -" name="username" required>

                    <h1>Password</h1>
                    <input type="password" class="input-field" id="password" placeholder="• • • • • • • • • • • • • • •" name="password" required>

                    <p id="error-msg" style="display: none;" class="error-msg">Invalid username or password</p> 
                    <!-- SOMEONE STYLE THE ERROR MESSAGE -->
                    <button class="submit-button" id="submit-btn" name="submit" type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");

        if (error) {
            document.getElementById("error-msg").style.display = "block";
        }

    </script>
