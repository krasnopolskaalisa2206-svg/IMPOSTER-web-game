<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home-style.css">
    <script src="sfxmanager"></script>
    <title>Imposter</title>
</head>
<body>
    
    <!-- The div class=outber border etc is for css to make double border-->
    <div class="outer-border">
        <div class="inner-border">
            <button class="home-button" id="register-btn">
            <img src="style-assets/register-icon.png" class="home-icon">
            <span>Register</span>
            </button>
            <button class="home-button" id="login-btn">
            <img src="style-assets/login-icon.png" class="home-icon">
            <span>Login</span>
            </button>
        </div>
    </div>

    <!-- JavaScript here: just assigning functions to the buttons-->
    <script>
        document.getElementById("register-btn").addEventListener('click', function() {
            window.location.href="register.php";
        });

        document.getElementById("login-btn").addEventListener('click', function() {
            window.location.href="login.php";
        });
    </script>
</body>
</html>
