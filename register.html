<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="home-style.css">
        <title>Imposter</title>
    </head>
    <body>
        <!-- The div class=outber border etc is for css to make double border-->
        <div class="outer-border">
            <div class="inner-border">
                <div class="login-box">
                    <h1>Username</h1>
                    <input type="text" class="input-field" id="username" placeholder="- - - - -">
    
                    <h1>Password</h1>
                    <input type="password" class="input-field" id="password" placeholder="• • • • •">
    
                    <button class="submit-button" id="submit-btn" onclick="handleRegister()">Register!</button>
                </div>
            </div>
        </div>
    
        <!-- JavaScript here: just assigning functions to the buttons-->
        <script>
            function handleRegister() {
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;
    
                console.log("Username:", username);         // these are for us in case there's a bug so we can check the usrnm and psswrd
                console.log("Password:", password);
    
                if (username && password) {                    // checks if all fields have been filled in
                    window.location.href = "main-menu.html";
    
                } else {
                    alert("Please fill in all fields");
                }
            }
        </script>
    </html>
